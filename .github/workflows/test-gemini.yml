name: Test Gemini

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check available models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not key:
              print("FAILED: GEMINI_API_KEY Secret is missing.")
              sys.exit(1)

          names = []
          page_token = ""

          try:
              while True:
                  params = {"pageSize": 1000}
                  if page_token:
                      params["pageToken"] = page_token

                  url = (
                      "https://generativelanguage.googleapis.com/"
                      "v1beta/models?"
                      + urllib.parse.urlencode(params)
                  )

                  request = urllib.request.Request(
                      url,
                      headers={"x-goog-api-key": key}
                  )

                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      result = json.load(response)

                  for model in result.get("models", []):
                      methods = model.get(
                          "supportedGenerationMethods", []
                      )
                      if "generateContent" in methods:
                          names.append(model["name"])

                  page_token = result.get("nextPageToken", "")
                  if not page_token:
                      break

          except urllib.error.HTTPError as error:
              print(f"FAILED: HTTP {error.code}")
              print("Model list request failed.")
              sys.exit(1)
          except (urllib.error.URLError, TimeoutError):
              print("FAILED: Network connection or timeout error.")
              sys.exit(1)
          except ValueError:
              print("FAILED: Invalid JSON response.")
              sys.exit(1)

          print("=== AVAILABLE MODELS ===")
          for name in sorted(set(names)):
              print(name.replace(key, "[REDACTED]"))
          print("=== END ===")

          if not names:
              print("FAILED: No generateContent models returned.")
              sys.exit(1)

          print("SUCCESS: Model list retrieved.")
          PY
